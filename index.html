<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>旅遊行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 id="page-title">行程</h1>
  <span class="readonly">唯讀</span>
</header>

<main>
  <section id="view-trip" class="view"></section>

  <section id="view-list" class="view" hidden>
    <div class="toolbar">
      <div class="segmented" role="tablist">
        <button id="seg-saved" class="on" type="button">收藏 <span id="count-saved"></span></button>
        <button id="seg-recs" type="button">附近推薦 <span id="count-recs"></span></button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="where">
        <select id="distance" aria-label="距離範圍">
          <option value="500">500 公尺內</option>
          <option value="1000" selected>1 公里內</option>
          <option value="3000">3 公里內</option>
          <option value="0">不限距離</option>
        </select>
        <button id="use-gps" type="button" class="link">📍 用我的位置</button>
        <button id="use-trip" type="button" class="link">🏨 以住宿為中心</button>
      </div>
      <p class="center-note" id="center-note"></p>
    </div>
    <ul class="places" id="places"></ul>
    <p class="credit" id="list-credit"></p>
  </section>

  <section id="view-map" class="view" hidden>
    <div id="map"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="trip" class="on" type="button"><span class="ico">🧳</span>行程</button>
  <button data-view="list" type="button"><span class="ico">📋</span>清單</button>
  <button data-view="map" type="button"><span class="ico">🗺️</span>地圖</button>
</nav>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="handle"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="theme.js"></script>
<script src="app.js"></script>
</body>
</html>
